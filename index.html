<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>NovaMine</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0
}

body{
font-family:Arial,sans-serif;
background:
radial-gradient(circle at top,#162b55 0,#07101f 45%,#030711 100%);
color:#fff;
min-height:100vh;
padding:15px
}

.container{
max-width:650px;
margin:auto
}

header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:18px
}

.logo{
font-size:25px;
font-weight:900;
color:#36f3ff;
text-shadow:0 0 15px #00eaff
}

.logout{
border:1px solid #ff4f75;
background:#ff17441c;
color:#ff6c8c;
padding:9px 13px;
border-radius:10px;
cursor:pointer
}

.card{
background:#0c1729dd;
border:1px solid #203758;
border-radius:18px;
padding:18px;
margin-bottom:15px;
box-shadow:0 0 20px #0006
}

.welcome{
font-size:21px;
font-weight:bold
}

.sub{
color:#8ea5c5;
font-size:13px;
margin-top:5px
}

.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px
}

.stat{
background:#091322;
border:1px solid #1c3454;
border-radius:14px;
padding:14px
}

.label{
font-size:12px;
color:#8298b7;
margin-bottom:7px
}

.value{
font-size:20px;
font-weight:bold;
color:#48f4ff;
word-break:break-word
}

.mining{
text-align:center;
padding:22px
}

.mining-icon{
font-size:55px;
margin-bottom:8px;
filter:drop-shadow(0 0 15px #00eaff)
}

.timer{
font-size:31px;
font-weight:900;
color:#fff;
margin:10px 0
}

.earn{
font-size:23px;
font-weight:bold;
color:#42ff9b;
text-shadow:0 0 10px #00ff8c
}

button{
border:0;
cursor:pointer;
font-weight:bold;
border-radius:12px;
padding:13px 16px;
font-size:14px
}

.primary{
background:linear-gradient(135deg,#00d9ff,#476cff);
color:#fff;
box-shadow:0 0 18px #00d9ff55
}

.success{
background:linear-gradient(135deg,#00e88b,#00a96d);
color:#fff
}

.warning{
background:linear-gradient(135deg,#ffc400,#ff7600);
color:#111
}

.danger{
background:linear-gradient(135deg,#ff416c,#c2185b);
color:#fff
}

button:disabled{
opacity:.45;
cursor:not-allowed
}

.actions{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:8px;
margin-top:16px
}

.section-title{
font-size:18px;
font-weight:bold;
margin-bottom:13px
}

.worker{
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
padding:13px;
margin-bottom:9px;
background:#091322;
border:1px solid #1b3454;
border-radius:13px
}

.worker-name{
font-weight:bold
}

.worker-info{
font-size:12px;
color:#849bb9;
margin-top:4px
}

.refbox{
background:#07111f;
border:1px dashed #27dfff;
padding:13px;
border-radius:13px;
word-break:break-all;
color:#52efff;
font-size:13px;
margin-bottom:10px
}

.form{
display:grid;
gap:10px
}

input{
width:100%;
padding:14px;
border-radius:11px;
border:1px solid #294565;
background:#07111f;
color:#fff;
outline:none
}

input:focus{
border-color:#32eaff;
box-shadow:0 0 10px #00d9ff33
}

.row{
display:grid;
grid-template-columns:1fr 1fr;
gap:9px
}

.message{
margin-top:10px;
padding:10px;
border-radius:10px;
font-size:13px;
display:none
}

.loading{
text-align:center;
padding:50px 10px;
color:#8fa8c8
}

.small{
font-size:12px;
color:#8298b7;
margin-top:7px
}

.badge{
display:inline-block;
padding:5px 9px;
border-radius:20px;
background:#00eaff18;
border:1px solid #00eaff55;
color:#52efff;
font-size:11px
}

@media(max-width:480px){
.actions{
grid-template-columns:1fr
}

.grid{
grid-template-columns:1fr 1fr
}

.worker{
align-items:flex-start
}

.row{
grid-template-columns:1fr
}
}
</style>
</head>

<body>

<div class="container" id="app">
<div class="loading">Loading NovaMine...</div>
</div>

<script>
const SUPABASE_URL =
"https://qrfpmqzeyuikplilbloi.supabase.co";

const SUPABASE_KEY =
"sb_publishable_2abwLSxLEvANWxXnxvmg2Q_HGln6tWx";

const db =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

let user=null;
let profile=null;
let wallet=null;
let timer=null;

const app=document.getElementById("app");

function money(n){
return Number(n||0).toFixed(4);
}

function esc(v){
return String(v??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;");
}

function showMessage(text,type="info"){
const el=document.getElementById("message");
if(!el)return;

el.textContent=text;
el.style.display="block";

if(type==="error"){
el.style.background="#ff174425";
el.style.color="#ff7691";
}else{
el.style.background="#00eaff18";
el.style.color="#65f4ff";
}
}

function getMiningAmount(){
if(!wallet)return 0;

let saved=Number(wallet.mining_balance||0);

if(!wallet.mining_started_at)
return saved;

const started=
new Date(wallet.mining_started_at).getTime();

let seconds=
Math.max(
0,
Math.floor((Date.now()-started)/1000)
);

seconds=Math.min(seconds,86400);

const power=
Number(wallet.worker_power||0);

return saved+(seconds*0.00005*power);
}

function formatTime(){
if(!wallet || !wallet.mining_started_at)
return "00:00:00";

let seconds=
Math.max(
0,
Math.floor(
(Date.now()-new Date(wallet.mining_started_at).getTime())/1000
)
);

seconds=Math.min(seconds,86400);

const h=String(Math.floor(seconds/3600)).padStart(2,"0");
const m=String(Math.floor((seconds%3600)/60)).padStart(2,"0");
const s=String(seconds%60).padStart(2,"0");

return `${h}:${m}:${s}`;
}

function referralLink(){
if(!profile?.ref_code)return "";

return new URL(
"account.html?ref="+
encodeURIComponent(profile.ref_code),
location.href
).href;
}

async function loadUser(){

const {data:{user:currentUser}}=
await db.auth.getUser();

if(!currentUser){
location.href="account.html";
return;
}

user=currentUser;

const [p,w]=await Promise.all([

db.from("profiles")
.select("*")
.eq("id",user.id)
.single(),

db.from("wallets")
.select("*")
.eq("user_id",user.id)
.single()

]);

if(p.error){
console.error(p.error);
app.innerHTML=
`<div class="card">
<h3>Profile error</h3>
<p class="small">${esc(p.error.message)}</p>
</div>`;
return;
}

if(w.error){
console.error(w.error);
app.innerHTML=
`<div class="card">
<h3>Wallet error</h3>
<p class="small">${esc(w.error.message)}</p>
</div>`;
return;
}

profile=p.data;
wallet=w.data;

render();
startDisplayTimer();
}

function render(){

const mining=
Boolean(wallet.mining_started_at);

const miningAmount=
getMiningAmount();

const link=
referralLink();

app.innerHTML=`

<header>
<div class="logo">⚡ NovaMine</div>
<button class="logout" onclick="logout()">Logout</button>
</header>

<div class="card">
<div class="welcome">
Welcome, ${esc(profile.display_name||profile.first_name||"Miner")} 👋
</div>
<div class="sub">
@${esc(profile.username||user.email?.split("@")[0]||"miner")}
</div>
</div>

<div class="grid">

<div class="stat">
<div class="label">MINING BALANCE</div>
<div class="value" id="miningBalance">
${money(miningAmount)} NOVA
</div>
</div>

<div class="stat">
<div class="label">NOVA BALANCE</div>
<div class="value">
${money(wallet.nova_balance)} NOVA
</div>
</div>

<div class="stat">
<div class="label">USDT BALANCE</div>
<div class="value">
$${money(wallet.usdt_balance)}
</div>
</div>

<div class="stat">
<div class="label">WORKER POWER</div>
<div class="value">
${Number(wallet.worker_power||0)} ⚡
</div>
</div>

</div>

<div class="card mining">

<div class="mining-icon">⛏️</div>

<div class="badge">
${mining ? "● MINING ACTIVE" : "● MINING STOPPED"}
</div>

<div class="timer" id="timer">
${formatTime()}
</div>

<div class="earn" id="liveEarn">
${money(miningAmount)} NOVA
</div>

<div class="small">
Mining rate: ${Number(wallet.worker_power||0)*0.00005} NOVA/sec
</div>

<div class="actions">

<button
class="primary"
id="startBtn"
onclick="startMining()"
${mining?"disabled":""}>
▶ Start
</button>

<button
class="danger"
id="stopBtn"
onclick="stopMining()"
${!mining?"disabled":""}>
■ Stop
</button>

<button
class="success"
onclick="claimMining()">
💰 Claim
</button>

</div>

<div id="message" class="message"></div>

</div>

<div class="card">

<div class="section-title">
⚡ Worker Power
</div>

<div class="worker">
<div>
<div class="worker-name">Basic Worker</div>
<div class="worker-info">+1 Power • Cost 0.5 NOVA</div>
</div>
<button class="warning" onclick="upgrade(1)">
Upgrade
</button>
</div>

<div class="worker">
<div>
<div class="worker-name">Power Worker</div>
<div class="worker-info">+3 Power • Cost 1.5 NOVA</div>
</div>
<button class="warning" onclick="upgrade(2)">
Upgrade
</button>
</div>

<div class="worker">
<div>
<div class="worker-name">Diamond Worker</div>
<div class="worker-info">+10 Power • Cost 5 NOVA</div>
</div>
<button class="warning" onclick="upgrade(3)">
Upgrade
</button>
</div>

</div>

<div class="card">

<div class="section-title">
🔄 Convert NOVA → USDT
</div>

<div class="form">

<input
id="convertAmount"
type="number"
step="any"
min="0"
placeholder="Enter NOVA amount">

<button
class="success"
onclick="convertNOVA()">
Convert to USDT
</button>

</div>

<div class="small">
Your available NOVA balance: ${money(wallet.nova_balance)} NOVA
</div>

</div>

<div class="card">

<div class="section-title">
💸 Withdraw USDT
</div>

<div class="form">

<input
id="withdrawAmount"
type="number"
step="any"
min="3"
placeholder="Minimum $3">

<input
id="withdrawWallet"
type="text"
placeholder="USDT wallet address">

<button
class="primary"
onclick="withdrawUSDT()">
Request Withdrawal
</button>

</div>

<div class="small">
Minimum withdrawal: $3 USDT
</div>

</div>

<div class="card">

<div class="section-title">
🎁 Invite & Earn
</div>

<div class="grid">

<div class="stat">
<div class="label">REFERRALS</div>
<div class="value">
${Number(profile.referrals||0)}
</div>
</div>

<div class="stat">
<div class="label">EARNINGS</div>
<div class="value">
$${money(profile.referral_earnings)}
</div>
</div>

</div>

<div style="margin-top:14px">

<div class="label">
YOUR INVITE LINK
</div>

<div class="refbox" id="refLink">
${esc(link)}
</div>

<button
class="primary"
onclick="copyReferral()"
style="width:100%">
📋 Copy Invite Link
</button>

</div>

<div class="small">
Earn $0.50 when someone joins using your referral link.
</div>

</div>
`;
}

function startDisplayTimer(){

clearInterval(timer);

timer=setInterval(()=>{

if(!wallet)return;

const mining=
Boolean(wallet.mining_started_at);

const amount=
getMiningAmount();

const balance=
document.getElementById("miningBalance");

const earn=
document.getElementById("liveEarn");

const time=
document.getElementById("timer");

if(balance)
balance.textContent=
money(amount)+" NOVA";

if(earn)
earn.textContent=
money(amount)+" NOVA";

if(time)
time.textContent=
formatTime();

},1000);
}

async function api(action,extra={}){

const {data,error}=
await db.functions.invoke(
"novamine-api",
{
body:{
action,
...extra
}
}
);

if(error)
throw error;

if(data?.error)
throw new Error(data.error);

return data;
}

async function startMining(){

try{

await api("start");

await refreshWallet();

showMessage(
"Mining started successfully ⚡"
);

}catch(e){
showMessage(
e.message||"Unable to start mining",
"error"
);
}
}

async function stopMining(){

try{

await api("stop");

await refreshWallet();

showMessage(
"Mining stopped and saved."
);

}catch(e){
showMessage(
e.message||"Unable to stop mining",
"error"
);
}
}

async function claimMining(){

try{

await api("claim");

await refreshWallet();

showMessage(
"Mining balance claimed into your NOVA wallet 💰"
);

}catch(e){
showMessage(
e.message||"Unable to claim",
"error"
);
}
}

async function upgrade(level){

const names={
1:"Basic Worker",
2:"Power Worker",
3:"Diamond Worker"
};

const costs={
1:.5,
2:1.5,
3:5
};

if(!confirm(
"Upgrade to "+names[level]+
" for "+costs[level]+" NOVA?"
))return;

try{

await api("upgrade",{level});

await refreshWallet();

showMessage(
names[level]+" purchased successfully ⚡"
);

}catch(e){
showMessage(
e.message||"Upgrade failed",
"error"
);
}
}

async function convertNOVA(){

const input=
document.getElementById("convertAmount");

const amount=
Number(input.value);

if(!amount || amount<=0){
showMessage(
"Enter a valid NOVA amount.",
"error"
);
return;
}

if(amount>Number(wallet.nova_balance||0)){
showMessage(
"Conversion amount is greater than your NOVA balance.",
"error"
);
return;
}

try{

await api("convert",{amount});

input.value="";

await refreshWallet();

showMessage(
"Conversion successful. USDT balance updated."
);

}catch(e){
showMessage(
e.message||"Conversion failed",
"error"
);
}
}

async function withdrawUSDT(){

const amount=
Number(
document.getElementById("withdrawAmount").value
);

const address=
document.getElementById("withdrawWallet").value.trim();

if(!amount || amount<3){
showMessage(
"Minimum withdrawal is $3 USDT.",
"error"
);
return;
}

if(amount>Number(wallet.usdt_balance||0)){
showMessage(
"Withdrawal amount is greater than your USDT balance.",
"error"
);
return;
}

if(address.length<8){
showMessage(
"Enter a valid USDT wallet address.",
"error"
);
return;
}

if(!confirm(
"Request withdrawal of $"+
amount.toFixed(2)+" USDT?"
))return;

try{

await api("withdraw",{
amount,
wallet_address:address
});

document.getElementById("withdrawAmount").value="";
document.getElementById("withdrawWallet").value="";

await refreshWallet();

showMessage(
"Withdrawal request submitted successfully."
);

}catch(e){
showMessage(
e.message||"Withdrawal failed",
"error"
);
}
}

async function copyReferral(){

const link=referralLink();

try{

await navigator.clipboard.writeText(link);

showMessage(
"Invite link copied 📋"
);

}catch(e){

const box=document.getElementById("refLink");

const range=
document.createRange();

range.selectNodeContents(box);

const selection=
window.getSelection();

selection.removeAllRanges();
selection.addRange(range);

showMessage(
"Select and copy the highlighted link."
);
}
}

async function refreshWallet(){

const {data,error}=
await db.from("wallets")
.select("*")
.eq("user_id",user.id)
.single();

if(error){
console.error(error);
return;
}

wallet=data;

render();
startDisplayTimer();
}

async function logout(){

clearInterval(timer);

await db.auth.signOut();

location.href="account.html";
}

loadUser();
</script>

</body>
</html>
